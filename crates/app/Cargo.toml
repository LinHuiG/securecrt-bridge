[package]
name = "securecrt-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "securecrt-bridge"
path = "src/main.rs"

[[bin]]
name = "securecrt-diagnose"
path = "src/diagnose.rs"

[[bin]]
name = "securecrt-session"
path = "src/session_main.rs"

[dependencies]
scb-core = { path = "../core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
windows = { workspace = true, features = ["Win32_System_Diagnostics_ToolHelp", "Win32_Security_Authorization", "Win32_System_Memory", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemServices"] }
