name: Build and test Windows
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Rust toolchain
        shell: pwsh
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Test
        shell: pwsh
        run: ./build.ps1 test
      - name: Build bundled installer
        shell: pwsh
        run: ./build.ps1 release
      - name: Ensure NSIS compiler
        shell: pwsh
        run: |
          if (!(Test-Path 'C:/Program Files (x86)/NSIS/makensis.exe')) { choco install nsis --no-progress -y }
      - name: Test persistent console channel
        shell: pwsh
        run: python tests/channel_process.py --exe "$pwd/target/release/securecrt-session.exe" --data "$pwd/target/channel-smoke"
      - name: Test installer controls
        shell: pwsh
        run: |
          $report = (& ./target/release/securecrt-bridge.exe --installer-self-test | Out-String) | ConvertFrom-Json
          if (-not $report.ok) { throw 'Installer self-test failed' }
          $report | ConvertTo-Json
          ./package.ps1 -NsisPath 'C:/Program Files (x86)/NSIS/makensis.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: SecureCRTBridge-Windows-x64
          path: dist/
